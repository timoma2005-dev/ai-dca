
[program:ai-dca-frontend-guard]
; 每 60 秒校验线上发布目录（MANIFEST + commit），被改动则自动回滚到最新合法发布
directory=/root/ai-dca
command=/bin/bash /root/ai-dca/scripts/cn-frontend/guard.sh
user=root
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/ai-dca-frontend-guard.log
stderr_logfile=/var/log/supervisor/ai-dca-frontend-guard.err.log
