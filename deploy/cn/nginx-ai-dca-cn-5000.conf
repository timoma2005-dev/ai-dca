# ── 登录/注册撞库限流（http 上下文；本 conf 由 nginx.conf 的 http{} 内 include 引入）──
# 按来源 IP 计费：稳态 10 请求/分钟，允许 10 个短时突发，超出返回 429。
# 灰云直连下 $binary_remote_addr 即真实客户端 IP；若前置可信 L7 负载均衡，
# 需改用 ngx_http_realip_module 后再以 $binary_remote_addr 计费，避免共享出口误伤。
# 仅精确作用于 /api/sync/auth/login 与 /register，避免误伤高频的 auth_request /check。
limit_req_zone $binary_remote_addr zone=aidca_auth_rl:10m rate=10r/m;
limit_req_status 429;

server {
    listen 5000 ssl;
    server_name cn.freebacktrack.tech fast.freebacktrack.tech;

    ssl_certificate /etc/letsencrypt/live/cn.freebacktrack.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cn.freebacktrack.tech/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/ai-dca-cn;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/x-javascript text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    brotli on;
    brotli_comp_level 5;
    brotli_static on;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml application/xml application/json application/javascript application/x-javascript text/javascript image/svg+xml image/x-icon font/ttf font/otf font/woff font/woff2;

    # ── 前端：Vite preview (127.0.0.1:4173, supervisor: ai-dca-frontend) ──
    # vite 挂掉时 502/504 回落到同一发布目录的静态文件。
    location /react-assets/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @frontend_static;
    }

    location = /asset-cache-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # ── RBAC：nginx auth_request 子请求 → services/auth GET /api/sync/auth/check（200 放行 / 401 未登录 / 403 权限不足）──
    # 读取 Authorization: Bearer 或 httpOnly 会话 cookie（aidca_session）。每个权限一个 internal location，
    # 不依赖父子请求间共享变量。auth 服务不可用时子请求失败 → 500（失败即拒绝）。
    location = /_rbac/nasdaq-radar {
        internal;
        proxy_pass http://127.0.0.1:8080/api/sync/auth/check?perm=api:nasdaq-radar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location = /_rbac/nasdaq-radar-compute {
        internal;
        proxy_pass http://127.0.0.1:8080/api/sync/auth/check?perm=api:nasdaq-radar-compute;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location = /_rbac/paper-trade {
        internal;
        proxy_pass http://127.0.0.1:8080/api/sync/auth/check?perm=api:paper-trade;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location = /_rbac/admin-auction {
        internal;
        proxy_pass http://127.0.0.1:8080/api/sync/auth/check?perm=menu:adminAuction:access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api/market-collector {
        return 308 /api/market-collector/;
    }

    location = /api/market-collector/backtest {
        proxy_pass http://127.0.0.1:18080/backtest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 量化模拟盘（adminQuant，SVIP）：需要 api:paper-trade。
    location /api/market-collector/api/paper-trade/ {
        auth_request /_rbac/paper-trade;
        proxy_pass http://127.0.0.1:18080/api/paper-trade/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/market-collector/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api/fund-limit {
        proxy_pass http://127.0.0.1:18080/fund-limit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    # 行情数据全本地：/api/markets/* 与 /api/fund-fee 不再代理到 workers。
    location /api/markets/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location = /api/fund-fee {
        proxy_pass http://127.0.0.1:18080/fund-fee;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    # 精确匹配优先于下方 ^~ 前缀：只给注册/登录加来源 IP 限流；
    # /check、/me、/menus、/logout、/admin 等高频或管理接口走通用 location，不受限。
    location = /api/sync/auth/login {
        limit_req zone=aidca_auth_rl burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/sync/auth/register {
        limit_req zone=aidca_auth_rl burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/sync/auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/notify/nasdaq-radar {
        auth_request /_rbac/nasdaq-radar;
        proxy_pass https://ai_dca_cf_api_v4/api/notify/nasdaq-radar;
        proxy_http_version 1.1;
        proxy_set_header Host api.freebacktrack.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location = /api/notify/nasdaq-radar/compute {
        auth_request /_rbac/nasdaq-radar-compute;
        proxy_pass https://ai_dca_cf_api_v4/api/notify/nasdaq-radar/compute;
        proxy_http_version 1.1;
        proxy_set_header Host api.freebacktrack.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /api/notify/ {
        proxy_pass http://127.0.0.1:8081/api/notify/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/account/ {
        proxy_pass http://127.0.0.1:8081/api/account/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/sync {
        proxy_pass http://127.0.0.1:8081/sync;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── ETF 份额监控：本地 SQLite 镜像（etf-mirror 服务，127.0.0.1:8082）──
    # CF worker 为数据源，镜像服务后台每 5 分钟同步；前端读本地毫秒级返回。
    # 未命中（历史日期等）由镜像服务回源 CF，断连时持续供旧数据。
    location = /api/etf-pcf-shares {
        proxy_pass http://127.0.0.1:8082/etf-pcf-shares;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location = /api/etf-pcf-limit {
        proxy_pass http://127.0.0.1:8082/etf-pcf-limit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        resolver 1.1.1.1 ipv6=off valid=30s;
        proxy_pass https://ai_dca_cf_api_v4;
        proxy_ssl_server_name on;
        proxy_ssl_name api.freebacktrack.tech;
        proxy_http_version 1.1;
        proxy_set_header Host api.freebacktrack.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 20s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 公众号文章存档（静态站，位于 /var/www/wechat）
    location /wechat/ {
        root /var/www;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 竞价看板静态页（iframe 同源加载，靠会话 cookie 鉴权）：需要 menu:adminAuction:access。
    location = /auction-board.html {
        auth_request /_rbac/admin-auction;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @frontend_static;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @frontend_static;
    }

    location @frontend_static {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
