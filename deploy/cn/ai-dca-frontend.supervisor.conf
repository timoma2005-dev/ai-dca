
[program:ai-dca-frontend]
; Vite preview 只监听本机，由 nginx (5000/443) 转发；静态目录为发布软链 /var/www/ai-dca-cn
directory=/root/ai-dca
command=/root/ai-dca/node_modules/.bin/vite preview --outDir /var/www/ai-dca-cn --host 127.0.0.1 --port 4173 --strictPort
user=root
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/ai-dca-frontend.log
stderr_logfile=/var/log/supervisor/ai-dca-frontend.err.log
