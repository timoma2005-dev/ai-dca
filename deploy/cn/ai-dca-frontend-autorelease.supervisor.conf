
[program:ai-dca-frontend-autorelease]
; push 到 GitHub origin/cn 后约 1 分钟内自动构建发布（只在前端文件有变化时）
directory=/root/ai-dca
command=/bin/bash /root/ai-dca/scripts/cn-frontend/autorelease.sh
user=root
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/ai-dca-frontend-autorelease.log
stderr_logfile=/var/log/supervisor/ai-dca-frontend-autorelease.err.log
